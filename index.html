<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>행성을 훔치다</title>
<style>
:root{--bg:#05070d;--fg:#e8ecf5;--dim:#9aa4bd;--line:#26304a;--card:#0d1322e6;--acc:#7cc4ff;
--r0:#8a93a8;--r1:#5ec27a;--r2:#4a8cff;--r3:#b36bff;--r4:#ffb347;--r5:#ff5c7a}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
canvas{display:block;position:fixed;inset:0;touch-action:none}
body{touch-action:none}
.hud{position:fixed;z-index:2}
#top{top:12px;left:14px;text-shadow:0 1px 4px #000}
#cr{font-size:24px;font-weight:700;color:var(--acc)}#inc{color:var(--dim);font-size:12px;margin-left:6px}
#btns{top:12px;right:12px;display:flex;gap:8px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#bottom{left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#prompt{pointer-events:auto;padding:10px 20px;background:var(--acc);color:#04101c;font-weight:700;border-radius:10px;display:none}
#info{max-width:560px;text-align:center;font-size:12px;color:var(--dim);background:var(--card);border-radius:10px;padding:8px 14px;display:none}
#info b{color:var(--fg);font-size:14px}#info i{font-style:normal;color:var(--acc)}
#stamBox{top:46px;left:14px;width:130px;height:7px;background:#0008;border-radius:4px;overflow:hidden}
#stam{height:100%;width:100%;background:#7cf09a}#stam.tired{background:#ff6a7a}
#cross{left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid #fff9;border-radius:50%;display:none;pointer-events:none}
.tc,.rb{display:none;touch-action:none}
body.touch .tc{display:block}body.touch #keys{display:none}
#joy{left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:#ffffff66}
.rb{width:64px;height:64px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;align-items:center;justify-content:center;font-size:12px;font-weight:700}
body.touch .rb{display:flex}
#jump{right:26px;bottom:40px}#run{right:100px;bottom:26px}#run.on{background:#7cc4ff88}
#lockBtn.on{background:var(--acc);color:#04101c}
#keys{left:14px;bottom:14px;font-size:11px;color:var(--dim)}
#toast{top:60px;left:50%;transform:translateX(-50%);background:#111a2e;border:1px solid var(--line);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#flash{inset:0;background:#f33;opacity:0;pointer-events:none;transition:opacity .4s}
#mission{top:62px;left:14px;font-size:12px;text-shadow:0 1px 4px #000}
#tag{top:82px;left:14px;font-size:12px;color:#ffd27a;text-shadow:0 1px 4px #000}
#tag.bad{color:#ff7a8a;font-weight:700}
#prow{display:flex;gap:8px}
.pb{pointer-events:auto;padding:10px 20px;background:var(--acc);color:#04101c;font-weight:700;border-radius:10px;display:none}
.pb.alt{background:#ffd27a}.pb.off{opacity:.45}
.ov{inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}
.ov.on{display:flex}
.card{background:#0d1322;border:1px solid var(--line);border-radius:14px;padding:18px;max-width:92vw}
#quiz .card{width:420px}#qq{font-size:15px;line-height:1.5;margin:8px 0 12px}
#qo{display:flex;flex-direction:column;gap:8px}#qo button{text-align:left;padding:10px 14px}
#qr{margin-top:10px;font-size:12px;color:var(--dim);min-height:34px}#qr b.ok{color:#7cf09a}#qr b.no{color:#ff7a8a}
#dex .card{width:560px;max-height:86vh;overflow:auto}
#dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.de{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:10px;cursor:pointer;background:#0a0f1b}
.de.sel{border-color:var(--acc)}.de i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 4px}
.de.lk i{background:#222a40!important}.de.lk{color:#556}
#dinf{margin-top:12px;font-size:12px;color:var(--dim);min-height:70px;line-height:1.6}#dinf b{color:var(--fg);font-size:14px}#dinf i{font-style:normal;color:var(--acc)}
#err{display:none;left:20px;top:80px;color:#ff8;max-width:80%}
</style>
</head>
<body>
<div class="hud" id="top"><span id="cr">✦ 0</span><span id="inc"></span></div>
<div class="hud" id="stamBox"><div id="stam"></div></div>
<div class="hud" id="mission"></div><div class="hud" id="tag"></div>
<div class="hud" id="cross"></div>
<div class="hud tc" id="joy"><div id="knob"></div></div>
<div class="hud rb" id="jump">점프</div><div class="hud rb" id="run">달리기</div>
<div class="hud" id="btns"><button id="dexBtn">📖</button><button id="lockBtn">🔒 시점</button><button id="buySpd"></button><button id="buySlot"></button></div>
<div class="hud" id="bottom"><div id="info"></div><div id="prow"><div id="prompt" class="pb"></div><div id="prompt2" class="pb alt"></div></div></div>
<div class="hud" id="keys">WASD 이동 · Shift 달리기 · Space 점프 · 드래그/🔒 시점 · E 훔치기 · R 연구 · F 판매 · B 도감</div>
<div class="hud ov" id="quiz"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span id="qt" style="font-size:11px;color:var(--dim)"></span><button id="qx">✕</button></div><div id="qq"></div><div id="qo"></div><div id="qr"></div></div></div>
<div class="hud ov" id="dex"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>📖 도감 <span id="dn"></span></b><button id="dclose">✕</button></div><div id="dgrid"></div><div id="dinf"></div></div></div>
<div class="hud" id="toast"></div>
<div class="hud" id="flash"></div>
<div class="hud" id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(typeof THREE==='undefined'){const e=document.getElementById('err');e.style.display='block';e.textContent='three.js를 불러오지 못했습니다 (인터넷 연결 필요).'}
const R=['실제','인터스텔라','아바타'];
const DB=[
['명왕성',0,.0022,.186,0,25,'#e9d6c3','#8a6f5c','하트 모양 평원은 질소 빙하 (2015, 뉴호라이즌스)'],
['수성',0,.055,.383,0,50,'#cfc8be','#6c665e','낮 430°C, 밤 -180°C. 하루가 1년의 2배'],
['화성',0,.107,.532,0,100,'#e8825a','#7a2f1c','올림푸스 산은 에베레스트의 2.5배 높이'],
['금성',0,.815,.949,1,260,'#f3dca0','#a8782c','표면 465°C — 수성보다 뜨겁고, 하루가 1년보다 길다'],
['지구',0,1,1,1,500,'#6fb4ff','#1b4f2e','생명이 확인된 유일한 행성'],
['프록시마 b',0,1.07,1.1,1,800,'#d9714f','#4a1a14','4.2광년 — 가장 가까운 외계행성. 1년이 11.2일'],
['트라피스트-1e',0,.692,.92,1,1000,'#9ad0e8','#3a5a7a','40광년, 행성 7개 중 하나. 액체 물이 있을 수도'],
['천왕성',0,14.5,4.01,2,2500,'#b5eaf0','#4aa3b5','자전축이 98° 누워서 굴러간다'],
['해왕성',0,17.1,3.88,2,3000,'#5b83ff','#14246e','초음속 바람, 시속 약 2,000km'],
['게자리 55e',0,8,1.88,2,4000,'#ff9a3c','#7a1a00','1년이 18시간. 표면은 용암 바다','glow'],
['케플러-452b',0,5,1.63,2,5000,'#a8d68a','#3d5a2a','1,400광년 — "지구의 사촌", 1년 385일 (질량 추정)'],
['만의 행성',1,.9,1,2,6000,'#f4fbff','#8fb0c8','얼어붙은 구름과 암모니아 대기 — 영화 설정'],
['토성',0,95.2,9.45,3,15000,'#ecd9a0','#a07d3c','밀도가 물보다 낮다 — 충분히 큰 욕조라면 뜬다','band ring'],
['목성',0,317.8,11.21,3,25000,'#e6c09a','#8a4a2a','대적점 폭풍은 지구보다 크다. 하루는 10시간','band'],
['HD 189733b',0,362,12.8,3,30000,'#3a62ff','#0a1a66','푸른 행성. 유리 비가 시속 8,700km 옆바람에 날린다','band'],
['WASP-76b',0,292,20.5,3,40000,'#ff6a3a','#4a0a0a','낮 2,400°C — 밤 쪽에선 철이 비로 내린다','band glow'],
['케플러-16b',0,106,8.45,3,50000,'#d8c9a8','#6a5a3c','태양이 둘 — 현실판 타투인','band'],
['페가수스자리 51b',0,149,13.5,3,70000,'#f2a65a','#8a3a14','1995년 첫 태양형 별 외계행성 (2019 노벨상)','band'],
['에드먼즈 행성',1,1,1,3,60000,'#9ee0a8','#2a6a54','인류의 새 보금자리 후보 — 영화 설정'],
['WASP-12b',0,467,21.3,4,150000,'#3a2a2a','#000','별의 조석력에 달걀 모양으로 찌그러지는 중','egg'],
['판도라',2,.45,.75,4,200000,'#5ff0c8','#0a4a6a','가스 거인 폴리페무스의 위성. 중력 0.8g, 공기엔 독가스','glow'],
['밀러의 행성',1,1.3,1,4,300000,'#7ec8ff','#0a3a7a','1시간이 지구의 7년 (블랙홀 시간 지연) — 영화 설정','glow'],
['폴리페무스',2,130,10,5,1000000,'#b58cff','#3a1a7a','판도라가 도는 가스 거인 — 영화 설정','band ring'],
];

const RC=['--r0','--r1','--r2','--r3','--r4','--r5'],RCOL=['#8a93a8','#5ec27a','#4a8cff','#b36bff','#ffb347','#ff5c7a'],RW=[50,28,14,6,1.6,.4];
const GROW=[8,15,30,60,120,240]; // 강착(성장) 시간 초 — 희귀할수록 길다
const MUT=[['',1],['고온 ×2',2],['거대 ×3',3]];
const P=DB.map((d,i)=>({id:i,name:d[0],grp:R[d[1]],M:d[2],R:d[3],t:d[4],price:d[5],c1:d[6],c2:d[7],fact:d[8],fx:d[9]||'',
  g:d[2]/(d[3]*d[3]),ve:11.186*Math.sqrt(d[2]/d[3]),inc:d[5]/25}));
const SOLAR=['명왕성','수성','화성','금성','지구','천왕성','해왕성','토성','목성'];
const idx=f=>P.filter(f).map(p=>p.id);
// 구역: 필요 속도 레벨, 추격자 속도, 월드 좌표
const Z=[
 {n:'태양계',ic:'☄️',req:0,gs:7,x:0,z:-66,col:0x3a3f4a,gc:0xaaaaaa,pool:idx(p=>SOLAR.includes(p.name))},
 {n:'외계행성',ic:'🛸',req:3,gs:9,x:0,z:-132,col:0x3a2a5a,gc:0x9a66ff,pool:idx(p=>p.grp==='실제'&&!SOLAR.includes(p.name))},
 {n:'가르강튀아',ic:'🕳️',req:6,gs:11,x:0,z:-198,col:0x10121c,gc:0xff8a2a,pool:idx(p=>p.grp==='인터스텔라')},
 {n:'알파 센타우리',ic:'🐉',req:9,gs:13,x:0,z:-264,col:0x0f4a4a,gc:0x2affc8,pool:idx(p=>p.grp==='아바타')},
];
const ZR=22,BW=4.5,BASE_R=18,SLOT_R=11,NEST_R=9;
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e4?(n/1e3).toFixed(n>=1e5?0:1)+'K':Math.floor(n)+'';
const SAVE='stealPlanet2';
const spdCost=l=>Math.floor(60*1.7**l),slotCost=n=>1000*2**(n-6);
function pickFrom(pool){
  const w=pool.map(i=>RW[P[i].t]),s=w.reduce((a,b)=>a+b);let r=Math.random()*s;
  for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0)return pool[k]}return pool[0];
}

// ---------- 상태 ----------
let S={cr:0,slots:6,spd:0,base:Array(12).fill(null),dex:{},mi:0,stolen:0,correct:0,studied:0,maxZ:-1,notes:{}};
try{const l=JSON.parse(localStorage.getItem(SAVE));if(l&&l.base)S=Object.assign(S,l)}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}};
const nests=Z.map(z=>({t:[0,0,0,0],s:[0,1,2,3].map(()=>pickFrom(z.pool))}));
const mul=o=>MUT[o.mut][1]*(o.st?1.5:1); // 연구된 행성은 ×1.5
const dexN=()=>Object.keys(S.dex).length;
const income=()=>(1+S.base.reduce((a,o)=>a+(o&&o.left<=0?P[o.id].inc*mul(o):0),0))*(1+.02*dexN()); // 도감 1종당 +2%
const newPlanet=id=>({id,mut:Math.random()<.03?2:Math.random()<.12?1:0,left:GROW[P[id].t],st:0,cd:0});
const freeSlot=()=>{for(let i=0;i<S.slots;i++)if(!S.base[i])return i;return -1};
let jumpHeld=false,stam=100,tired=false,runHeld=false,lockMode=false,joy={x:0,y:0},pickOv=null;
let carry=null,raid=null,raidT=50,toastT=0,target=null;
let cycT=0,night=0;
let quizOpen=false,dexOpen=false,quizCtx=null,meteors=[],meteorT=2,flareT=12,slowT=0,stun=0,curZone=-1,lastZone=-2,comet=null,cometT=40,rocks=[];

function toast(m,sec){const t=$('#toast');t.textContent=m;t.classList.add('on');toastT=sec||2.2}
function flash(c,o){const f=$('#flash');f.style.background=c;f.style.opacity=o||.5;setTimeout(()=>f.style.opacity=0,250)}
function slotPos(i){const a=i/12*Math.PI*2;return {x:Math.cos(a)*SLOT_R,z:Math.sin(a)*SLOT_R}}
function nestPos(zi,k){const a=k*Math.PI/2+Math.PI/4;return {x:Z[zi].x+Math.cos(a)*NEST_R,z:Z[zi].z+Math.sin(a)*NEST_R}}
const locked=zi=>S.spd<Z[zi].req;
// 걸을 수 있는 곳: 기지 → 다리 → 1단계 → 다리 → 2단계 … (잠긴 단계 원판은 제외)
function walkable(x,z){
  if(Math.hypot(x,z)<BASE_R)return true;
  for(let i=0;i<Z.length;i++){
    const near=Z[i].z+ZR,far=i?Z[i-1].z-ZR:-BASE_R;
    if(Math.abs(x)<BW&&z<=far+.01&&z>=near-.01)return true;
    if(!locked(i)&&Math.hypot(x-Z[i].x,z-Z[i].z)<ZR)return true;
  }
  return false;
}

function infoHTML(p,o){
  return `<b>${p.name}</b> · ${p.grp} · 중력 <i>${p.g.toFixed(2)}g</i> · 탈출속도 <i>${p.ve.toFixed(1)}km/s</i>`+
   (o&&o.mut?` · <i>${MUT[o.mut][0]}</i>`:'')+(o?(o.st?' · <i>연구됨 ✔ ×1.5</i>':' · ❓미연구'):'')+`<br>${p.fact}`;
}
function refreshBtns(){
  const bs=$('#buySlot'),bp=$('#buySpd');
  bs.textContent=S.slots>=12?'MAX':`슬롯 +1 · ${fmt(slotCost(S.slots))}`;
  bp.textContent=`⚡ Lv${S.spd} · ${fmt(spdCost(S.spd))}`;
  bs.disabled=S.slots>=12||S.cr<slotCost(S.slots);bp.disabled=S.cr<spdCost(S.spd);
  $('#dexBtn').textContent=`📖 ${dexN()}/${P.length}`;
}
$('#buySlot').onclick=e=>{e.target.blur();const c=slotCost(S.slots);if(S.slots<12&&S.cr>=c){S.cr-=c;S.slots++;save()}};
$('#buySpd').onclick=e=>{e.target.blur();const c=spdCost(S.spd);if(S.cr>=c){S.cr-=c;S.spd++;toast(`⚡ Lv${S.spd}`);save()}};

// ---------- 행동 ----------
function grab(zi,k){
  if(carry)return;
  if(freeSlot()<0)return toast('슬롯이 가득 찼다');
  const id=nests[zi].s[k];carry={id,z:zi,k};nests[zi].t[k]=1e9;
  setCarryMesh(id);guards[zi].chase=true;toast('도망쳐! 기지로!');
}
function caught(){
  const lost=Math.floor(S.cr*.15);S.cr-=lost;toast(`잡혔다! -${fmt(lost)}`);
  nests[carry.z].s[carry.k]=carry.id;nests[carry.z].t[carry.k]=0;
  guards.forEach(g=>g.chase=false);clearCarry();carry=null;
  me.pos.set(0,0,14);me.vy=0;
  flash('#f33',.5);
}
function deposit(){
  const i=freeSlot();if(i<0){return}
  const id=carry.id,o=newPlanet(id);S.base[i]=o;S.stolen++;
  let msg=`${P[id].name} 훔쳤다!${o.mut?' '+MUT[o.mut][0]:''}`;
  if(!S.dex[id]){S.dex[id]=1;const rw=P[id].price/10;S.cr+=rw;msg+=` · 📖 도감 +${fmt(rw)}`}
  toast(msg);
  nests[carry.z].s[carry.k]=pickFrom(Z[carry.z].pool);nests[carry.z].t[carry.k]=rnd(8,15);
  guards.forEach(g=>g.chase=false);clearCarry();carry=null;save();
}
function sell(i){const o=S.base[i],p=P[o.id];S.cr+=p.price/2*mul(o);S.base[i]=null;toast(`+${fmt(p.price/2*mul(o))}`);save()}
const modal=()=>quizOpen||dexOpen;
function act(k){
  if(!target||modal())return;
  if(target.kind==='nest')grab(target.z,target.k);
  else if(k==='f')sell(target.i);
  else study(target.i);
}
$('#prompt').addEventListener('pointerdown',e=>{e.preventDefault();act(target&&target.kind==='nest'?'e':'f')});
$('#prompt2').addEventListener('pointerdown',e=>{e.preventDefault();act('r')});

// ---------- 교육: 연구 퀴즈 ----------
// [문장, 정답(1=O), 해설]
const QB=[
['금성은 수성보다 표면 온도가 높다.',1,'금성 465°C — 짙은 CO₂ 온실효과. 수성은 대기가 거의 없다.'],
['화성의 올림푸스 산은 에베레스트보다 높다.',1,'약 22km — 에베레스트(8.8km)의 2.5배.'],

    ped.position.set(p.x,.4,p.z);scene.add(ped);baseMesh.push({ped,id:-1,grp:null,mut:0});
  }
  // 구역
  Z.forEach((z,zi)=>{
    disc(ZR,z.col,z.x,z.z);
    const lt=label(`${zi+1}단계 · ${z.ic} ${z.n}`,'#ffffff',26);lt.position.set(z.x,13,z.z);scene.add(lt);
    const bar=new THREE.Mesh(new THREE.PlaneGeometry(BW*2,9),new THREE.MeshBasicMaterial({color:0xff3355,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}));
    bar.position.set(z.x,4.5,z.z+ZR-.2);scene.add(bar);
    const bs=label(`🔒 ⚡Lv${z.req}`,'#ff8aa0',16);bs.position.set(z.x,10,z.z+ZR-.2);bar.userData.sign=bs;scene.add(bs);barriers.push(bar);
    // 테두리 링
    const ring=new THREE.Mesh(new THREE.TorusGeometry(ZR,.25,8,64),new THREE.MeshBasicMaterial({color:z.gc}));ring.rotation.x=Math.PI/2;ring.position.set(z.x,.05,z.z);scene.add(ring);
    nestMesh.push([]);
    for(let k=0;k<4;k++){
      const p=nestPos(zi,k),ped=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.7,.8,16),new THREE.MeshLambertMaterial({color:0x8a93a8}));
      ped.position.set(p.x,.4,p.z);scene.add(ped);nestMesh[zi].push({id:-1,grp:null});
    }
    // 수호자
    const gd=blocky(z.gc,0x222222,'#d4d4d4',.9);gd.position.set(z.x,0,z.z);scene.add(gd);
    guards.push({m:gd,chase:false,home:new THREE.Vector3(z.x,0,z.z)});
  });
  // 장식: 가르강튀아(블랙홀) / 폴리페무스(가스 거인)
  const bh=new THREE.Mesh(new THREE.SphereGeometry(5,32,16),new THREE.MeshBasicMaterial({color:0x000000}));bh.position.set(Z[2].x,26,Z[2].z);scene.add(bh);
  const disk=new THREE.Mesh(new THREE.RingGeometry(7,13,64),new THREE.MeshBasicMaterial({color:0xff9a3a,side:THREE.DoubleSide,transparent:true,opacity:.85}));disk.rotation.x=Math.PI/2.3;disk.position.copy(bh.position);scene.add(disk);
  const poly=makePlanet(P.findIndex(p=>p.name==='폴리페무스'));poly.scale.setScalar(11);poly.position.set(Z[3].x,36,Z[3].z);scene.add(poly);
  const sunM=new THREE.Mesh(new THREE.SphereGeometry(6,24,16),new THREE.MeshBasicMaterial({color:0xffd27a}));sunM.position.set(Z[0].x,34,Z[0].z-20);scene.add(sunM);
  const str=new THREE.Mesh(new THREE.SphereGeometry(3,24,16),new THREE.MeshBasicMaterial({color:0xff9a7a}));str.position.set(Z[1].x,30,Z[1].z-20);scene.add(str);
  // 2단계 바위(플레이어 차폐용 — 별은 -z 방향)
  [[0,-12],[-15,0],[15,0],[0,13],[-14,-12]].forEach(([dx,dz])=>{
    const r=new THREE.Mesh(new THREE.BoxGeometry(4,3.4,3),new THREE.MeshLambertMaterial({color:0x5a5f78}));
    r.position.set(Z[1].x+dx,1.7,Z[1].z+dz);scene.add(r);rocks.push({x:Z[1].x+dx,z:Z[1].z+dz});
  });
  // 플레이어
  me=blocky(0x3b82f6,0x4a9a4a,'#f4d03f');me.pos=me.position;me.vy=0;me.pos.set(0,0,14);scene.add(me);
  // 라이벌
  rival=blocky(0xd23a4a,0x333333,'#e8b090');rival.visible=false;rival.state='off';scene.add(rival);
  rival.mark=label('라이벌!','#ff6a7a',6);rival.mark.position.set(0,9.5,0);rival.add(rival.mark);rival.mark.scale.multiplyScalar(1/.55);
  clock=new THREE.Clock();
  // 입력
  addEventListener('keydown',e=>{
    if(quizOpen){if(e.code==='Escape')closeQuiz();const n=+e.code.replace('Digit','');if(n>=1&&n<=3)answer(n-1);return}
    if(dexOpen){if(e.code==='Escape'||e.code==='KeyB')toggleDex(false);return}
    keys[e.code]=true;
    if(e.code==='KeyE')act('e');if(e.code==='KeyF')act('f');if(e.code==='KeyR')act('r');if(e.code==='KeyB')toggleDex(true);
    if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
  addEventListener('keyup',e=>keys[e.code]=false);
  setupPointers();
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
}

// ---------- 매 프레임 ----------
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function syncPlanets(t){
  nests.forEach((n,zi)=>n.s.forEach((id,k)=>{
    const m=nestMesh[zi][k],empty=n.t[k]>0;
    if(empty&&m.grp){scene.remove(m.grp);m.grp=null;m.id=-1}
    if(!empty&&(m.id!==id)){if(m.grp)scene.remove(m.grp);m.grp=makePlanet(id);m.id=id;scene.add(m.grp)}
    if(m.grp){const p=nestPos(zi,k),r=m.grp.userData.r;m.grp.scale.setScalar(r);m.grp.position.set(p.x,1.2+r+.4+Math.sin(t*1.5+k)*.15,p.z);m.grp.rotation.y=t*.5;m.grp.userData.pick={kind:'nest',z:zi,k}}
  }));
  baseMesh.forEach((m,i)=>{
    const o=i<S.slots?S.base[i]:null;m.ped.visible=i<S.slots;
    if(!o){if(m.grp){scene.remove(m.grp);m.grp=null;m.id=-1}return}
    if(m.id!==o.id){if(m.grp)scene.remove(m.grp);m.grp=makePlanet(o.id);m.id=o.id;scene.add(m.grp)}
    const pr=1-Math.max(0,o.left)/GROW[P[o.id].t],r=m.grp.userData.r*(.35+.65*pr)*(o.mut===2?1.4:1);
    const mat=m.grp.userData.mat;mat.color.setScalar(.35+.65*pr);
    if(o.mut===1){mat.emissive.set(0xff5a1a);mat.emissiveIntensity=.5}
    else if(o.mut===2){mat.emissive.set(0x9a4aff);mat.emissiveIntensity=.4}
    const p=slotPos(i);m.grp.scale.setScalar(r);m.grp.position.set(p.x,1+r+.5+Math.sin(t*1.5+i)*.15,p.z);m.grp.rotation.y=t*.5;m.grp.userData.pick={kind:'base',i};
  });
}
function updateRival(dt){
  raidT-=dt;
  if(rival.state==='off'){
    if(raidT<=0){
      const has=S.base.map((o,i)=>o&&o.left<=0&&i<S.slots?i:-1).filter(i=>i>=0);
      if(has.length>=2){const a=rnd(0,6.28);rival.position.set(Math.cos(a)*34,0,Math.sin(a)*34);rival.visible=true;rival.state='in';rival.slot=has[Math.floor(rnd(0,has.length))];rival.t=0;rival.stolen=null;toast('라이벌 침입! 막아라!')}
      else raidT=15;
    }
    return;
  }
  const rp=rival.position;
  if(rival.state==='in'){
    const o=S.base[rival.slot];
    if(!o){rival.state='out';return}
    const sp=slotPos(rival.slot),dx=sp.x-rp.x,dz=sp.z-rp.z,d=Math.hypot(dx,dz);
    if(d>2){rp.x+=dx/d*7*dt;rp.z+=dz/d*7*dt;rival.rotation.y=Math.atan2(dx,dz);animateWalk(rival,dt*3)}
    else if((rival.t+=dt)>2){rival.stolen=o;S.base[rival.slot]=null;rival.state='flee';toast(`${P[o.id].name} 도둑맞는 중! 잡아라!`)}
    if(dist2(rp,me.pos)<2){rival.state='out';toast('막았다!')}
  }
  if(rival.state==='flee'||rival.state==='out'){
    const d=Math.hypot(rp.x,rp.z)||1;rp.x+=rp.x/d*9*dt;rp.z+=rp.z/d*9*dt;rival.rotation.y=Math.atan2(rp.x,rp.z);animateWalk(rival,dt*3);
    if(rival.state==='flee'&&dist2(rp,me.pos)<2){
      const i=S.base[rival.slot]?freeSlot():rival.slot;if(i>=0)S.base[i]=rival.stolen;rival.stolen=null;rival.state='out';toast('되찾았다!');save();
    }
    if(d>46){
      if(rival.stolen)toast(`${P[rival.stolen.id].name}을(를) 도둑맞았다`);
      rival.visible=false;rival.state='off';raidT=rnd(40,70);save();
    }
  }
}
const NOTES=['☄️ 운석 낙하! 빨간 원을 피하세요 — 대기가 없는 곳은 운석이 그대로 떨어진다',
 '☀ 적색왜성 행성은 강한 플레어를 맞는다 — 플레어 직전엔 바위 뒤로!',
 '⏳ 블랙홀 근처는 시간이 느리다 — 이곳에 있는 동안 기지가 ×3 빠르게 흐른다',
 '🪐 판도라 중력 0.8g — 더 높이 뛴다'];
const gravityNow=()=>(carry?Math.max(.4,Math.min(2.5,P[carry.id].g)):1)*(curZone===3?.8:1); // 들고 있는 행성의 중력이 내게 걸린다
const zoneAt=()=>{for(let i=0;i<Z.length;i++)if(Math.hypot(me.pos.x-Z[i].x,me.pos.z-Z[i].z)<ZR+1)return i;return -1};
const shaded=()=>rocks.some(r=>me.pos.z>r.z&&me.pos.z-r.z<8&&Math.abs(me.pos.x-r.x)<3.4);
function pushRocks(){
  rocks.forEach(r=>{const dx=me.pos.x-r.x,dz=me.pos.z-r.z,hx=2.7,hz=2.2;
    if(Math.abs(dx)<hx&&Math.abs(dz)<hz&&me.pos.y<3.4){if(hx-Math.abs(dx)<hz-Math.abs(dz))me.pos.x=r.x+Math.sign(dx||1)*hx;else me.pos.z=r.z+Math.sign(dz||1)*hz}});
}
function spawnMeteor(){
  const aim=Math.random()<.5,x=me.pos.x+(aim?rnd(-2,2):rnd(-12,12)),z=me.pos.z+(aim?rnd(-2,2):rnd(-12,12));
  if(Math.hypot(x-Z[0].x,z-Z[0].z)>ZR-2)return;
  const ring=new THREE.Mesh(new THREE.RingGeometry(2.2,2.8,32),new THREE.MeshBasicMaterial({color:0xff4455,transparent:true,opacity:.8,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.set(x,.08,z);scene.add(ring);
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0),new THREE.MeshLambertMaterial({color:0x7a6a5a,emissive:0x552200}));
  m.position.set(x,32,z);scene.add(m);meteors.push({x,z,t:0,ring,m});
}
function spawnComet(){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xcff6ff})));
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.9,8,12),new THREE.MeshBasicMaterial({color:0x7cc4ff,transparent:true,opacity:.55}));
  tail.rotation.z=Math.PI/2;tail.position.x=-4.5;g.add(tail);
  const z=rnd(-8,8);g.position.set(-28,2.4,z);scene.add(g);comet={g,z};toast('☄ 혜성 출현! 닿으면 포획');
}
function hazards(dt){
  if(curZone!==lastZone){
    if(curZone>=0){if(curZone>S.maxZ)S.maxZ=curZone;if(!S.notes[curZone]){S.notes[curZone]=1;toast(NOTES[curZone],4.5);save()}if(curZone===1)flareT=12}
    lastZone=curZone;
  }
  stun=Math.max(0,stun-dt);slowT=Math.max(0,slowT-dt);
  if(curZone===1)pushRocks();
  // 운석 (1단계)
  if(curZone===0&&(meteorT-=dt)<=0){meteorT=rnd(1.1,2.2);spawnMeteor()}
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.t+=dt;const k=m.t/1.3;
    if(k<1){m.m.position.y=32*(1-k*k);m.m.rotation.x+=dt*3;m.ring.material.opacity=.35+.5*Math.sin(m.t*14)**2}
    else{
      if(me.pos.y<2.2&&Math.hypot(me.pos.x-m.x,me.pos.z-m.z)<3.2){stam=Math.max(0,stam-45);if(stam<=0)tired=true;stun=.5;flash('#ff8a3a',.45);toast('☄ 운석 충돌!')}
      scene.remove(m.m,m.ring);m.m.geometry.dispose();m.ring.geometry.dispose();meteors.splice(i,1);
    }
  }
  // 항성 플레어 (2단계)
  const tag=[];let bad=false;
  if(curZone===1){
    flareT-=dt;
    if(flareT<=0){flareT=rnd(14,18);flash('#fff',.85);
      if(shaded())toast('☀ 바위 뒤라서 무사!');else{stam=0;tired=true;slowT=4;toast('☀ 플레어 피해! 느려짐')}}
    else if(flareT<3.5){tag.push(`☀ 플레어 ${Math.ceil(flareT)}s — 바위 뒤로!`);bad=true}
  }
  if(curZone===2)tag.push('⏳ 시간 ×3');
  const gE=gravityNow();if(Math.abs(gE-1)>.02)tag.push(`중력 ${gE.toFixed(2)}g`);
  if(slowT>0)tag.push('🔥 느려짐');
  const te=$('#tag');te.textContent=tag.join(' · ');te.classList.toggle('bad',bad);
  // 혜성 (기지 근처, 가끔)
  if(!comet){if(Math.hypot(me.pos.x,me.pos.z)<BASE_R+4&&!carry&&(cometT-=dt)<=0){cometT=rnd(60,90);spawnComet()}}
  else{
    comet.g.position.x+=9*dt;
    if(Math.hypot(me.pos.x-comet.g.position.x,me.pos.z-comet.z)<2.8){const b=income()*40;S.cr+=b;toast(`☄ 혜성 포획! +${fmt(b)} · 핼리 혜성은 약 76년마다 온다`,3.5);scene.remove(comet.g);comet=null}
    else if(comet.g.position.x>28){scene.remove(comet.g);comet=null}
  }
}
function animateWalk(m,ph){const p=m.userData,s=Math.sin(ph*4)*.9;p.legL.rotation.x=s;p.legR.rotation.x=-s;p.armL.rotation.x=-s;p.armR.rotation.x=s}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  curZone=zoneAt();
  const tdil=curZone===2?3:1; // 가르강튀아: 시간 지연으로 기지가 ×3 빠르게 흐른다
  S.cr+=income()*dt*tdil;
  nests.forEach(n=>n.t.forEach((v,k)=>{if(v>0&&v<1e8&&(n.t[k]-=dt)<=0)n.t[k]=0}));
  cycT+=dt;
  if(night>0){night-=dt;if(night<=0){night=0;toast('☀️ 아침 — 둥지가 새로 채워졌다')}}
  else if(cycT>=300){cycT=0;night=12;toast('🌙 밤! 성장 ×30 · 둥지 리셋',3);flash('#112',.55);
    nests.forEach((n,zi)=>n.s.forEach((_,k)=>{if(!(carry&&carry.z===zi&&carry.k===k)){n.s[k]=pickFrom(Z[zi].pool);n.t[k]=0}}))}
  S.base.forEach(o=>{if(!o)return;if(o.left>0)o.left-=dt*tdil*(night>0?30:1);if(o.cd>0)o.cd-=dt});
  // 이동
  const f=[-Math.sin(yaw),-Math.cos(yaw)],rt=[Math.cos(yaw),-Math.sin(yaw)];
  let mx=0,mz=0;
  if(keys.KeyW||keys.ArrowUp){mx+=f[0];mz+=f[1]}if(keys.KeyS||keys.ArrowDown){mx-=f[0];mz-=f[1]}
  if(keys.KeyD||keys.ArrowRight){mx+=rt[0];mz+=rt[1]}if(keys.KeyA||keys.ArrowLeft){mx-=rt[0];mz-=rt[1]}
  mx+=rt[0]*joy.x+f[0]*joy.y;mz+=rt[1]*joy.x+f[1]*joy.y;
  if(modal()||stun>0){mx=0;mz=0}
  let spd=10+.9*S.spd;if(carry)spd/=1+P[carry.id].ve/80;if(slowT>0)spd*=.6;
  const ml=Math.hypot(mx,mz),moving=ml>.05;
  const wantRun=(keys.ShiftLeft||keys.ShiftRight||runHeld)&&moving;
  if(wantRun&&!tired&&stam>0){spd*=1.6;stam-=22*dt;if(stam<=0){stam=0;tired=true}}
  else{stam=Math.min(100,stam+(moving?9:18)*dt);if(tired&&stam>=30)tired=false}
  const sb=$('#stam');sb.style.width=stam+'%';sb.classList.toggle('tired',tired);
  if(moving){
    mx/=ml;mz/=ml;const ox=me.pos.x,oz=me.pos.z,nx=ox+mx*spd*dt,nz=oz+mz*spd*dt;
    if(walkable(nx,nz)){me.pos.x=nx;me.pos.z=nz}else if(walkable(nx,oz))me.pos.x=nx;else if(walkable(ox,nz))me.pos.z=nz;
    me.rotation.y=Math.atan2(mx,mz);animateWalk(me,t*spd*.25)
  }else animateWalk(me,0);
  if(!modal()&&stun<=0&&(keys.Space||jumpHeld)&&me.pos.y<=0){me.vy=13}
  me.vy-=34*gravityNow()*dt;me.pos.y+=me.vy*dt;if(me.pos.y<0){me.pos.y=0;me.vy=0}
  Z.forEach((z,zi)=>{barriers[zi].visible=barriers[zi].userData.sign.visible=locked(zi)});
  hazards(dt);
  // 수호자
  guards.forEach((g,zi)=>{
    const z=Z[zi],gp=g.m.position,tg=g.chase?me.pos:g.home,dx=tg.x-gp.x,dz=tg.z-gp.z,d=Math.hypot(dx,dz);
    if(d>.8){gp.x+=dx/d*z.gs*dt;gp.z+=dz/d*z.gs*dt;g.m.rotation.y=Math.atan2(dx,dz);animateWalk(g.m,t*z.gs*.25)}
    else animateWalk(g.m,0);
    if(g.chase&&carry&&Math.hypot(me.pos.x-gp.x,me.pos.z-gp.z)<1.8&&me.pos.y<2)caught();
  });
  if(carry&&Math.hypot(me.pos.x,me.pos.z)<BASE_R-2){if(freeSlot()>=0)deposit();else{toast('슬롯이 가득 찼다 — 판매하세요')}}
  updateRival(dt);
  syncPlanets(t);
  // 대상 탐색
  target=null;let bd=4.5;
  if(!carry)nests.forEach((n,zi)=>{if(locked(zi))return;n.s.forEach((id,k)=>{if(n.t[k]>0)return;const d=dist2(me.pos,nestPos(zi,k));if(d<bd){bd=d;target={kind:'nest',z:zi,k,id}}})});
  for(let i=0;i<S.slots;i++){const o=S.base[i];if(!o)continue;const d=dist2(me.pos,slotPos(i));if(d<bd){bd=d;target={kind:'base',i,id:o.id}}}
  if(pickOv&&(pickOv.t-=dt)>0){
    const pk=pickOv.pk;
    if(pk.kind==='base'&&S.base[pk.i]){const d=dist2(me.pos,slotPos(pk.i));if(!target||d<=7)target={kind:'base',i:pk.i,id:S.base[pk.i].id}}
  }else pickOv=null;
  const inf=$('#info'),pr=$('#prompt'),p2=$('#prompt2');
  if(target&&!modal()){
    inf.style.display='block';inf.innerHTML=infoHTML(P[target.id],target.kind==='base'?S.base[target.i]:null);
    pr.style.display='block';
    if(target.kind==='nest'){pr.textContent='E 훔치기';p2.style.display='none'}
    else{
      const o=S.base[target.i];
      pr.textContent=o.left>0?`성장 중 ${Math.ceil(o.left)}s · F 판매`:`F 판매 +${fmt(P[o.id].price/2*mul(o))}`;
      if(o.st)p2.style.display='none';
      else{p2.style.display='block';p2.textContent=o.cd>0?`연구 ${Math.ceil(o.cd)}s`:'R 연구';p2.classList.toggle('off',o.cd>0)}
    }
  }else{inf.style.display='none';pr.style.display='none';p2.style.display='none'}
  // 카메라
  const cp=Math.cos(pitch);
  camera.position.set(me.pos.x+Math.sin(yaw)*cp*camDist,me.pos.y+2.5+Math.sin(pitch)*camDist,me.pos.z+Math.cos(yaw)*cp*camDist);
  camera.lookAt(me.pos.x,me.pos.y+2.5,me.pos.z);
  renderer.render(scene,camera);
  $('#cr').textContent='✦ '+fmt(S.cr);$('#inc').textContent='+'+fmt(income())+'/s';
  refreshBtns();missionTick();
  if(toastT>0&&(toastT-=dt)<=0)$('#toast').classList.remove('on');
}
let saveI=setInterval(save,5000);
if(typeof THREE!=='undefined'){init();frame()}
</script>
