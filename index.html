<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>행성을 훔치다</title>
<style>
:root{--bg:#05070d;--fg:#e8ecf5;--dim:#9aa4bd;--line:#26304a;--card:#0d1322e6;--acc:#7cc4ff}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
canvas{display:block;position:fixed;inset:0;touch-action:none}
body{touch-action:none;overscroll-behavior:none}
.hud{position:fixed;z-index:2}
#top{top:12px;left:14px;text-shadow:0 1px 4px #000}
#cr{font-size:24px;font-weight:700;color:var(--acc)}#inc{color:var(--dim);font-size:12px;margin-left:6px}
#btns{top:12px;right:12px;display:flex;gap:8px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.sel{border-color:var(--acc);color:var(--acc)}
#bottom{left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#prompt{pointer-events:auto;padding:10px 20px;background:var(--acc);color:#04101c;font-weight:700;border-radius:10px;display:none;cursor:pointer}
#prompt.off{opacity:.5}
#info{max-width:560px;text-align:center;font-size:12px;color:var(--dim);background:var(--card);border-radius:10px;padding:8px 14px;display:none}
#info b{color:var(--fg);font-size:14px}#info i{font-style:normal;color:var(--acc)}
#stamBox{top:46px;left:14px;width:130px;height:7px;background:#0008;border-radius:4px;overflow:hidden}
#stam{height:100%;width:100%;background:#7cf09a}#stam.tired{background:#ff6a7a}
#cross{left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid #fff9;border-radius:50%;display:none;pointer-events:none}
.tc,.rb{display:none;touch-action:none}
body.touch .tc{display:block}body.touch #keys{display:none}
#joy{left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30}
#knob{position:absolute;left:50%;top:50%;width:31%;height:31%;margin:-15.5% 0 0 -15.5%;border-radius:50%;background:#ffffff66}
.rb{width:64px;height:64px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;align-items:center;justify-content:center;font-size:12px;font-weight:700}
body.touch .rb{display:flex}
#jump{right:26px;bottom:40px}#run{right:100px;bottom:26px}#run.on{background:#7cc4ff88}
#lockBtn.on{background:var(--acc);color:#04101c}
#keys{left:14px;bottom:14px;font-size:11px;color:var(--dim)}
#toast{top:60px;left:50%;transform:translateX(-50%);background:#111a2e;border:1px solid var(--line);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#flash{inset:0;background:#f33;opacity:0;pointer-events:none;transition:opacity .4s}
#mission{top:62px;left:14px;font-size:12px;text-shadow:0 1px 4px #000}
#tag{top:82px;left:14px;font-size:12px;color:#ffd27a;text-shadow:0 1px 4px #000}
#carryTag{top:100px;left:14px;font-size:12px;color:#9dffb0;text-shadow:0 1px 4px #000}
.ov{inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}
.ov.on{display:flex}
.card{background:#0d1322;border:1px solid var(--line);border-radius:14px;padding:18px;max-width:94vw}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
#quiz .card{width:460px}#qq{font-size:15px;line-height:1.55;margin:10px 0 12px}
#qo{display:flex;flex-direction:column;gap:8px}#qo button{text-align:left;padding:10px 14px}
#qr{margin-top:10px;font-size:12px;color:var(--dim);min-height:34px}#qr b.ok{color:#7cf09a}#qr b.no{color:#ff7a8a}
#qn{display:none;margin-top:8px;background:var(--acc);color:#04101c;font-weight:700}
#dex .card{width:560px;max-height:86vh;overflow:auto}
#dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.de{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:10px;cursor:pointer;background:#0a0f1b}
.de.sel{border-color:var(--acc)}.de i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 4px}
.de.lk i{background:#222a40!important}.de.lk{color:#556}
#dinf{margin-top:12px;font-size:12px;color:var(--dim);min-height:70px;line-height:1.6}#dinf b{color:var(--fg);font-size:14px}#dinf i{font-style:normal;color:var(--acc)}
#shop .card{width:640px;max-height:88vh;overflow:auto}
#stabs,#ssub{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.it{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 6px;font-size:11px;line-height:1.3}
.it.eq{border-color:#7cf09a}.it.own{border-color:var(--acc)}
.it .sw{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;border:2px solid #fff4}
.it em{font-style:normal;color:var(--acc)}.it span{color:var(--dim)}
#shint{font-size:12px;color:var(--dim);margin:6px 0}
#menu{background:radial-gradient(ellipse at center,#0b1230cc,#02030acc);z-index:9;flex-direction:column;text-align:center;gap:0}
#menu h1{font-size:46px;margin:0 0 6px;letter-spacing:2px;text-shadow:0 0 24px #4a8cff88}
#menu .sub{color:var(--dim);margin-bottom:22px}
#menu .how{max-width:420px;font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:22px}
#menu .how b{color:var(--fg)}
#menu button{display:block;width:220px;margin:6px auto;padding:12px;font-size:16px}
#menu #mstart{background:var(--acc);color:#04101c;font-weight:700}
body.touch #lockBtn,body.touch #mhint{display:none}
body.touch #bottom{bottom:150px}
body.touch #toast{white-space:normal;max-width:90vw;text-align:center}
body.touch #prompt{padding:14px 26px;font-size:16px}
.card{touch-action:pan-y}
@media (min-width:700px) and (pointer:coarse){
 #joy{left:36px;bottom:44px;width:210px;height:210px}
 .rb{width:104px;height:104px;font-size:18px}
 #jump{right:40px;bottom:60px}#run{right:164px;bottom:40px}
 body.touch #bottom{bottom:260px}
}
@media (max-width:640px){
 #cr{font-size:20px}button{padding:6px 9px;font-size:13px}#btns{gap:5px;top:8px;right:8px}
 #menu h1{font-size:32px}#info{max-width:92vw;font-size:11px}
 #quiz .card,#shop .card,#dex .card{width:96vw;padding:14px}#qq{font-size:14px}
 #sgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
 #mission,#tag,#carryTag{font-size:11px}
}
#err{display:none;left:20px;top:80px;color:#ff8;max-width:80%}
</style>
</head>
<body>
<div class="hud" id="top"><span id="cr">✦ 0</span><span id="inc"></span></div>
<div class="hud" id="stamBox"><div id="stam"></div></div>
<div class="hud" id="mission"></div><div class="hud" id="tag"></div><div class="hud" id="carryTag"></div>
<div class="hud" id="cross"></div>
<div class="hud tc" id="joy"><div id="knob"></div></div>
<div class="hud rb" id="jump">점프</div><div class="hud rb" id="run">달리기</div>
<div class="hud" id="btns"><button id="dexBtn">📖</button><button id="shopBtn">🛒 상점</button><button id="lockBtn">🔒 시점</button></div>
<div class="hud" id="bottom"><div id="info"></div><div id="prompt"></div></div>
<div class="hud" id="keys">WASD 이동 · Shift 달리기 · Space 점프 · 클릭=시점 고정(Esc 해제) · 두 손가락 스크롤=회전 · 핀치=줌 · E 상호작용 · F 판매 · B 도감</div>
<div class="hud ov on" id="menu"><h1>🪐 행성을 훔치다</h1><div class="sub">고1 통합과학으로 우주의 행성을 훔치는 3D 게임</div>
<div class="how"><b>행성</b>에 다가가 E → 문제를 맞히면 훔칠 수 있다 (문제 푸는 동안 시간 정지)<br><b>수호자</b>를 피해 기지로 돌아오면 수익이 쌓인다<br>각 단계의 <b>문</b>은 시험을 통과해야 열린다 · 돈으로 <b>상점</b>에서 스프링·가방·꾸미기</div>
<button id="mstart">▶ 시작하기</button><button id="mnew">새로 시작</button><div id="mhint" style="font-size:11px;color:var(--dim);margin-top:10px">Enter / Space 로도 시작</div></div>
<div class="hud ov" id="quiz"><div class="card"><div class="row"><span id="qt" style="font-size:11px;color:var(--dim)"></span><button id="qx">✕</button></div><div id="qq"></div><div id="qo"></div><div id="qr"></div><button id="qn">계속 (Space)</button></div></div>
<div class="hud ov" id="dex"><div class="card"><div class="row" style="margin-bottom:10px"><b>📖 도감 <span id="dn"></span></b><button id="dclose">✕</button></div><div id="dgrid"></div><div id="dinf"></div></div></div>
<div class="hud ov" id="shop"><div class="card"><div class="row"><b>🛒 우주 잡화점 <span id="sc" style="color:var(--acc);margin-left:8px"></span></b><button id="sx">✕</button></div><div id="stabs"></div><div id="ssub"></div><div id="shint"></div><div id="sgrid"></div></div></div>
<div class="hud" id="toast"></div>
<div class="hud" id="flash"></div>
<div class="hud" id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(typeof THREE==='undefined'){const e=document.getElementById('err');e.style.display='block';e.textContent='three.js를 불러오지 못했습니다 (인터넷 연결 필요).'}
const R=['실제','인터스텔라','아바타'];
const DB=[

['수성',0,.055,.383,0,50,'#cfc8be','#6c665e','낮 430°C, 밤 -180°C. 하루가 1년의 2배'],

['금성',0,.815,.949,1,260,'#f3dca0','#a8782c','표면 465°C — 수성보다 뜨겁고, 하루가 1년보다 길다'],
['지구',0,1,1,1,500,'#6fb4ff','#1b4f2e','생명이 확인된 유일한 행성'],
['프록시마 b',0,1.07,1.1,1,800,'#d9714f','#4a1a14','4.2광년 — 가장 가까운 외계행성. 1년이 11.2일'],
['트라피스트-1e',0,.692,.92,1,1000,'#9ad0e8','#3a5a7a','40광년, 행성 7개 중 하나. 액체 물이 있을 수도'],

['케플러-452b',0,5,1.63,2,5000,'#a8d68a','#3d5a2a','1,400광년 — "지구의 사촌", 1년 385일 (질량 추정)'],

['토성',0,95.2,9.45,3,15000,'#ecd9a0','#a07d3c','밀도가 물보다 낮다 — 충분히 큰 욕조라면 뜬다','band ring'],
['목성',0,317.8,11.21,3,25000,'#e6c09a','#8a4a2a','대적점 폭풍은 지구보다 크다. 하루는 10시간','band'],
['HD 189733b',0,362,12.8,3,30000,'#3a62ff','#0a1a66','푸른 행성. 유리 비가 시속 8,700km 옆바람에 날린다','band'],
['WASP-76b',0,292,20.5,3,40000,'#ff6a3a','#4a0a0a','낮 2,400°C — 밤 쪽에선 철이 비로 내린다','band glow'],
['케플러-16b',0,106,8.45,3,50000,'#d8c9a8','#6a5a3c','태양이 둘 — 현실판 타투인','band'],
['페가수스자리 51b',0,149,13.5,3,70000,'#f2a65a','#8a3a14','1995년 첫 태양형 별 외계행성 (2019 노벨상)','band'],
['에드먼즈 행성',1,1,1,3,60000,'#9ee0a8','#2a6a54','인류의 새 보금자리 후보 — 영화 설정'],
['WASP-12b',0,467,21.3,4,150000,'#3a2a2a','#000','별의 조석력에 달걀 모양으로 찌그러지는 중','egg'],
['판도라',2,.45,.75,4,200000,'#5ff0c8','#0a4a6a','가스 거인 폴리페무스의 위성. 중력 0.8g, 공기엔 독가스','glow'],
['밀러의 행성',1,1.3,1,4,300000,'#7ec8ff','#0a3a7a','1시간이 지구의 7년 (블랙홀 시간 지연) — 영화 설정','glow'],
['폴리페무스',2,130,10,5,1000000,'#b58cff','#3a1a7a','판도라가 도는 가스 거인 — 영화 설정','band ring'],
['태양',0,333000,109.1,5,3000000,'#ffe9a0','#ff9a2a','지구 질량의 33만 배 — 태양계 질량의 99.86%. 지름은 지구의 109배','glow star'],
['프록시마 센타우리',0,40600,16.8,4,400000,'#ff8a6a','#8a2a1a','가장 가까운 별(4.2광년). 작은 적색왜성이라 수명이 수조 년','glow star'],
];
const RW=[50,28,14,6,1.6,.4];
const GROW=[8,15,30,60,120,240]; // 강착(성장) 시간 초 — 희귀할수록 길다
const MUT=[['',1],['고온 ×2',2],['거대 ×3',3]];
const P=DB.map((d,i)=>({id:i,name:d[0],grp:R[d[1]],M:d[2],R:d[3],t:d[4],price:d[5],c1:d[6],c2:d[7],fact:d[8],fx:d[9]||'',
  g:d[2]/(d[3]*d[3]),ve:11.186*Math.sqrt(d[2]/d[3]),inc:d[5]/25}));
const SOLAR=['태양','명왕성','수성','화성','금성','지구','천왕성','해왕성','토성','목성'];
const idx=f=>P.filter(f).map(p=>p.id);
// ---------- 지도: 정사각형 구역을 위(−z)로 이어 붙인다 (기지 → 1단계 → 2단계 …) ----------
const TS=44,H=TS/2,SS=88,SH=SS/2; // 기지 한 변 44, 각 단계는 넓이 4배(한 변 88)
const Z=[
 {n:'태양계',ic:'☄️',gs:16,col:['#3a3f4a','#464c5c'],gc:0xaaaaaa,pool:idx(p=>SOLAR.includes(p.name))},
 {n:'외계행성',ic:'🛸',gs:19,col:['#3a2a5a','#483670'],gc:0x9a66ff,pool:idx(p=>p.grp==='실제'&&!SOLAR.includes(p.name))},
 {n:'가르강튀아',ic:'🕳️',gs:22,col:['#12141f','#1c2034'],gc:0xff8a2a,pool:idx(p=>p.grp==='인터스텔라')},
 {n:'알파 센타우리',ic:'🐉',gs:25,col:['#0f4a4a','#16605e'],gc:0x2affc8,pool:idx(p=>p.grp==='아바타')},
].map((z,i)=>Object.assign(z,{x:0,z:-(H+SS*(i+.5))}));
const SLOTMAX=10,SPDMAX=10;
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>n>=999500?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e4?(n/1e3).toFixed(n>=1e5?0:1)+'K':Math.floor(n)+'';
const SAVE='stealPlanet4',SAVE_OLD='stealPlanet3'; // v4: 오픈월드 확장용 필드 추가 (v3 세이브는 읽어서 이어받는다)
const spdCost=l=>Math.floor(80*1.8**l),slotCost=n=>1000*2**(n-6);
function pickFrom(pool){
  const w=pool.map(i=>RW[P[i].t]),s=w.reduce((a,b)=>a+b);let r=Math.random()*s;
  for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0)return pool[k]}return pool[0];
}
// ---------- 상점 데이터 ----------
// 스프링: [이름, 색, 가격, 점프 배율, 이동속도 +, 장식 이모지]
const SPR=[
 ['기본','#9aa4b8',0,1,0,''],['구리','#d2824a',300,1.1,0,''],['초록','#5ec27a',1200,1.2,1,''],['파랑','#4a8cff',5000,1.3,2,''],
 ['보라','#b36bff',20000,1.4,3,'✨'],['황금','#ffd24a',80000,1.5,4,'👑'],['분홍','#ff6fae',300000,1.6,5,'💗'],
 ['불꽃','#ff5a2a',1e6,1.7,7,'🔥'],['무지개','#ffffff',5e6,1.85,9,'🌈'],['우주','#1c1c4a',3e7,2,12,'🪐'],

const DECO={
 floor:{n:'바닥',v:[['잔디','#3c8f48','#358040',0],['돌 타일','#8a93a8','#7a8398',300],['우주','#2a2a5a','#34346a',800],['모래','#d8c488','#cdb877',800],['눈','#e6eef8','#d3deee',1500],['나무판','#9a6a3a','#8a5c30',1500],['네온','#0d3a40','#12525c',4000]]},

function genLayout(zi){
  const cz=Z[zi].z,stars=[],items=[],SOLO=4;
  STARS[zi].forEach(def=>{
    const rad=def.R+6+(def.orb-1)*2.4,lim=SH-rad-3;
    for(let t=0;t<300;t++){
      const x=rnd(-lim,lim),z=cz+rnd(-lim,lim);
      if((Math.hypot(x,z-cz)>rad*.6&&stars.every(s=>Math.hypot(s.x-x,s.z-z)>s.rad+rad-4))||t===299){stars.push(Object.assign({},def,{x,z,rad}));break}
    }
  });
  stars.forEach((st,si)=>{for(let i=0;i<st.orb;i++){const r=st.R+6+i*2.4,w=(Math.random()<.5?-1:1)*rnd(3,5.5)/r;items.push({kind:'orbit',s:si,r,a:rnd(0,6.28),w,x:st.x,z:st.z})}});
  const solos=[];
  for(let t=0;t<600&&solos.length<SOLO;t++){
    const x=rnd(-SH+6,SH-6),z=cz+rnd(-SH+6,SH-12);
    if(stars.every(s=>Math.hypot(s.x-x,s.z-z)>s.rad+3)&&Math.hypot(x,z-cz)>9&&solos.every(o=>Math.hypot(o.x-x,o.z-z)>16))solos.push({x,z});
  }
  solos.forEach(p=>items.push({kind:'solo',x:p.x,z:p.z}));
  return{stars,items};
}
function stepLayout(l,dt){l.items.forEach(it=>{if(it.kind!=='orbit')return;it.a+=it.w*dt;const st=l.stars[it.s];it.x=st.x+Math.cos(it.a)*it.r;it.z=st.z+Math.sin(it.a)*it.r})}
const LAY=Z.map((_,i)=>{const l=genLayout(i);stepLayout(l,0);return l});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const mkQ=a=>({q:a[0],opts:shuffle([a[1],a[2],a[3],a[4]].map((t,i)=>({t,ok:i===0}))),why:a[5]});
function openQuiz(ctx){
  quizCtx=Object.assign({i:0,right:0,done:false},ctx);quizOpen=true;releaseLock();
  $('#qt').textContent=ctx.title;$('#quiz').classList.add('on');showQ();
}
function showQ(){
  const c=quizCtx,q=c.cur=mkQ(c.qs[c.i]);c.done=false;
  $('#qq').textContent=(c.qs.length>1?`(${c.i+1}/${c.qs.length}) `:'')+q.q;$('#qr').innerHTML='';$('#qn').style.display='none';
  const box=$('#qo');box.innerHTML='';
  q.opts.forEach((o,k)=>{const b=document.createElement('button');b.textContent=`${k+1}. ${o.t}`;b.onclick=()=>answer(k);box.append(b)});
}
function answer(k){
  const c=quizCtx;if(!c||c.done||!c.cur.opts[k])return;c.done=true;c.answered=true;
  const q=c.cur,ok=q.opts[k].ok;
  [...$('#qo').children].forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.style.borderColor='#7cf09a';else if(j===k)b.style.borderColor='#ff7a8a'});
  if(ok){c.right++;S.correct++}
  $('#qr').innerHTML=`<b class="${ok?'ok':'no'}">${ok?'정답!':'오답'}</b> ${q.why}`;
  const n=$('#qn');n.style.display='inline-block';n.textContent=c.i+1<c.qs.length?'다음 문제 (Space)':'확인 (Space)';
}
function nextQ(){
  const c=quizCtx;if(!c||!c.done)return;
  if(c.i+1<c.qs.length){c.i++;showQ();return}
  closeQuiz(true);
}
function closeQuiz(finish){
  const c=quizCtx;quizOpen=false;quizCtx=null;quizClosedAt=performance.now();$('#quiz').classList.remove('on');
  if(c&&(finish||c.answered))c.onDone(c.right>=c.need); // 한 문제라도 답했으면 ✕/Esc로 닫아도 결과를 반영한다
  save();
}
$('#qx').onclick=()=>closeQuiz(false);$('#qn').onclick=nextQ;

// ---------- 행동 ----------
function tryGrab(zi,k){
  if(paused()||locked(zi))return;
  if(carry.length>=cap())return toast(cap()>1?'가방이 가득 찼다 — 기지에 가져다 놓자':'손이 가득! 상점에서 봉다리를 사면 더 들 수 있다');
  if(freeCount()<=carry.length)return toast('기지 슬롯이 가득 찼다 — 판매하거나 칸을 늘리자');
  if(nests[zi].t[k]>0)return; // 이미 가져갔거나 다시 자라는 중인 둥지
  if(nests[zi].cd[k]>0)return toast(`재도전까지 ${Math.ceil(nests[zi].cd[k])}s`);
  const id=nests[zi].s[k],p=P[id];
  openQuiz({title:`⏸ 시간 정지 · ${p.name} — 문제를 맞혀야 훔칠 수 있다`,qs:[PQ[p.name]],need:1,onDone(ok){
    if(ok){carry.push({id,z:zi,k,st:1});nests[zi].t[k]=1e9;syncCarry();toast('도망쳐! 기지로!')}
    else{nests[zi].cd[k]=15;toast('오답 — 15초 뒤 다시 도전')}
  }});
}
function openGate(){
  const zi=S.zone;if(zi>=Z.length||paused())return;
  const qs=shuffle(GQ.slice()).slice(0,3);
  openQuiz({title:`🔒 ${zi+1}단계 ${Z[zi].ic} ${Z[zi].n} 입장 시험 — 3문제 중 2문제`,qs,need:2,onDone(ok){
    if(ok){S.zone=Math.max(S.zone,zi+1);toast(`🔓 ${zi+1}단계 열림! ${Z[zi].ic} ${Z[zi].n}`,3);flash('#7cf09a',.35);save()}
    else toast('통과 실패 — 다시 도전하세요')
  }});
}
function loseCarry(){
  carry.forEach(c=>{nests[c.z].s[c.k]=c.id;nests[c.z].t[c.k]=0});
  carry=[];syncCarry();
}
function caught(){
  const had=carry.length,lost=Math.floor(S.cr*(had?.15:.05));S.cr-=lost;toast(`잡혔다!${had?' 행성을 빼앗기고':''} -${fmt(lost)}`);
  loseCarry();me.pos.set(SPAWN.x,0,SPAWN.z);me.vy=0;flash('#f33',.5);
}
function respawn(){
  const had=carry.length;if(had)loseCarry();
  me.pos.set(SPAWN.x,0,SPAWN.z);me.vy=0;toast(had?'우주로 떨어졌다! 행성은 제자리로 돌아갔다':'우주로 떨어져서 스폰 지점으로 돌아왔다');
}
function deposit(){
  let msg=[];
  while(carry.length){
    const i=freeSlot();if(i<0){if(performance.now()-fullToastAt>3000){fullToastAt=performance.now();toast('슬롯이 가득 찼다 — 판매하세요')}break}
    const c=carry.shift(),id=c.id;S.base[i]=newPlanet(id,c.st);S.stolen++;
    msg.push(P[id].name+(S.base[i].mut?` (${MUT[S.base[i].mut][0]})`:''));
    if(!S.dex[id]){S.dex[id]=1;const rw=P[id].price/10;S.cr+=rw;toast(`📖 도감 등록! +${fmt(rw)}`,2.6)}
    nests[c.z].s[c.k]=pickFrom(Z[c.z].pool);nests[c.z].t[c.k]=rnd(8,15);
  }
  syncCarry();
  if(msg.length){toast(msg.join(', ')+' 훔쳤다!');save()}
}
function sell(i){const o=S.base[i];if(!o)return; // 라이벌이 막 훔쳐 갔거나 이미 판 칸이면 무시
  const p=P[o.id],v=p.price/2*mul(o);S.cr+=v;S.base[i]=null;toast(`+${fmt(v)}`);save()}
function act(k){
  if(!target||paused())return;
  if(target.kind==='nest'&&k==='e')tryGrab(target.z,target.k);
  else if(target.kind==='base'&&k==='f')sell(target.i);
  else if(target.kind==='npc'&&k==='e')openShop();
  else if(target.kind==='gate'&&k==='e')openGate();
}
$('#prompt').addEventListener('pointerdown',e=>{e.preventDefault();if(target)act(target.kind==='base'?'f':'e')});

// ---------- 매 프레임 ----------
function syncPlanets(t){
  nests.forEach((n,zi)=>n.s.forEach((id,k)=>{
    const m=nestMesh[zi][k],empty=n.t[k]>0;
    if(empty&&m.grp){scene.remove(m.grp);freePlanet(m.grp);m.grp=null;m.id=-1}
    if(!empty&&(m.id!==id)){if(m.grp){scene.remove(m.grp);freePlanet(m.grp)}m.grp=makePlanet(id);m.id=id;scene.add(m.grp)}
    if(m.grp){const p=nestPos(zi,k),r=m.grp.userData.r;m.grp.scale.setScalar(r);m.grp.position.set(p.x,(p.kind==='orbit'?2.6:1.3)+r+Math.sin(t*1.5+k)*.15,p.z);m.grp.rotation.y=t*(p.kind==='orbit'?.9:.5);m.grp.userData.pick={kind:'nest',z:zi,k}}
  }));
  baseMesh.forEach((m,i)=>{
    const o=i<S.slots?S.base[i]:null;m.ped.visible=i<S.slots;
    if(!o){if(m.grp){scene.remove(m.grp);freePlanet(m.grp);m.grp=null;m.id=-1}return}
    if(m.id!==o.id||m.mut!==o.mut){if(m.grp){scene.remove(m.grp);freePlanet(m.grp)}m.grp=makePlanet(o.id);m.id=o.id;m.mut=o.mut;scene.add(m.grp)} // 같은 행성이라도 돌연변이가 바뀌면 재질을 새로 만든다
    const pr=1-Math.max(0,o.left)/GROW[P[o.id].t],r=m.grp.userData.r*(.35+.65*pr)*(o.mut===2?1.4:1);
    const mat=m.grp.userData.mat;mat.color.setScalar(.35+.65*pr);
    if(o.mut===1){mat.emissive.set(0xff5a1a);mat.emissiveIntensity=.5}
    else if(o.mut===2){mat.emissive.set(0x9a4aff);mat.emissiveIntensity=.4}
    const p=slotPos(i);m.grp.scale.setScalar(r);m.grp.position.set(p.x,.8+r+.5+Math.sin(t*1.5+i)*.15,p.z);m.grp.rotation.y=t*.5;m.grp.userData.pick={kind:'base',i};
  });
}
function updateRival(dt){
  raidT-=dt;
  if(rival.state==='off'){
    if(raidT<=0){
      const has=S.base.map((o,i)=>o&&o.left<=0&&i<S.slots?i:-1).filter(i=>i>=0);
      if(has.length>=2){rival.sd=Math.random()<.5?-1:1;rival.position.set(rival.sd*(H-2),0,rnd(-6,16));rival.visible=true;rival.state='in';rival.slot=has[Math.floor(rnd(0,has.length))];rival.t=0;rival.stolen=null;toast('라이벌 침입! 막아라!')}
      else raidT=15;
    }
    return;
  }
  const rp=rival.position;
  if(rival.state==='in'){
    const o=S.base[rival.slot];
    if(!o){rival.state='out';return}
    const sp=slotPos(rival.slot),dx=sp.x-rp.x,dz=sp.z-rp.z,d=Math.hypot(dx,dz);
    if(d>2){rp.x+=dx/d*9*dt;rp.z+=dz/d*9*dt;rival.rotation.y=Math.atan2(dx,dz);animateWalk(rival,performance.now()/1000*3)}
    else if((rival.t+=dt)>2){rival.stolen=o;S.base[rival.slot]=null;rival.state='flee';toast(`${P[o.id].name} 도둑맞는 중! 잡아라!`)}
    if(dist2(rp,me.pos)<2.2){rival.state='out';toast('막았다!')}
  }
  if(rival.state==='flee'||rival.state==='out'){
    rp.x+=rival.sd*12*dt;rival.rotation.y=Math.atan2(rival.sd,0);animateWalk(rival,performance.now()/1000*3);
    if(rival.state==='flee'&&dist2(rp,me.pos)<2.4){
      const i=S.base[rival.slot]?freeSlot():rival.slot;if(i>=0)S.base[i]=rival.stolen;rival.stolen=null;rival.state='out';toast('되찾았다!');save();
    }
    if(Math.abs(rp.x)>H-.5){
      if(rival.stolen)toast(`${P[rival.stolen.id].name}을(를) 도둑맞았다`);
      rival.visible=false;rival.state='off';raidT=rnd(40,70);save();
    }
  }
}
const NOTES=['🌍 대기가 없는 곳이 많다 — 낮밤 온도 차가 크다','⭐ 쌍성·적색왜성 — 별마다 환경이 다르다','⏳ 블랙홀 근처는 시간이 느리다 — 여기 있는 동안 기지가 ×3 빠르게 흐른다','🪐 판도라 중력 0.8g — 더 높이 뛴다'];
const gravityNow=()=>(carry.length?clamp(Math.max(...carry.map(c=>P[c.id].g)),.6,2.2):1)*(curZone===3?.8:1);
const zoneAt=()=>{for(let i=0;i<Z.length;i++)if(inTile(me.pos.x,me.pos.z,Z[i].z,1,SH))return i;return -1};
function hazards(dt){
  if(curZone!==lastZone){
    if(curZone>=0&&!S.notes[curZone]){S.notes[curZone]=1;toast(NOTES[curZone],4.5);save()}
    lastZone=curZone;
  }
  const tag=[];
  if(curZone===2)tag.push('⏳ 시간 ×3');
  const gE=gravityNow();if(Math.abs(gE-1)>.02)tag.push(`중력 ${gE.toFixed(2)}g`);
  if(night>0)tag.push('🌙 밤 — 성장 ×30');
  setTxt('#tag',tag.join(' · '));
  setTxt('#carryTag',carry.length?`✋ ${carry.map(c=>P[c.id].name).join(', ')} (${carry.length}/${cap()}) — 기지로!`:'');
  if(!comet){if(inTile(me.pos.x,me.pos.z,0)&&!carry.length&&(cometT-=dt)<=0){cometT=rnd(60,90);spawnComet()}}
  else{

    if(Math.hypot(me.pos.x-comet.g.position.x,me.pos.z-comet.z)<3){const b=income()*40;S.cr+=b;toast(`☄ 혜성 포획! +${fmt(b)} · 핼리 혜성은 약 76년마다 온다`,3.5);scene.remove(comet.g);freeTree(comet.g);comet=null}
    else if(comet.g.position.x>H+8){scene.remove(comet.g);freeTree(comet.g);comet=null}
  }
}

  const tail=new THREE.Mesh(new THREE.ConeGeometry(.9,8,12),new THREE.MeshBasicMaterial({color:0x7cc4ff,transparent:true,opacity:.55}));
  tail.rotation.z=Math.PI/2;tail.position.x=-4.5;g.add(tail);
  const z=rnd(-6,14);g.position.set(-H-6,2.4,z);scene.add(g);comet={g,z};toast('☄ 혜성 출현! 닿으면 포획');
}
function frame(){
  requestAnimationFrame(frame);
  const raw=Math.min(.05,clock.getDelta()),t=clock.elapsedTime,dt=paused()?0:raw;

  else if(cycT>=300){cycT=0;night=12;toast('🌙 밤! 성장 ×30 · 둥지 리셋',3);flash('#112',.55);
    nests.forEach((n,zi)=>n.s.forEach((_,k)=>{if(!carry.some(c=>c.z===zi&&c.k===k)){n.s[k]=pickFrom(Z[zi].pool);n.t[k]=0}}))}
  S.base.forEach(o=>{if(!o)return;if(o.left>0)o.left-=dt*tdil*(night>0?30:1)});
  // 이동
  const f=[-Math.sin(yaw),-Math.cos(yaw)],rt=[Math.cos(yaw),-Math.sin(yaw)];
  let mx=0,mz=0;
  if(keys.KeyW||keys.ArrowUp){mx+=f[0];mz+=f[1]}if(keys.KeyS||keys.ArrowDown){mx-=f[0];mz-=f[1]}
  if(keys.KeyD||keys.ArrowRight){mx+=rt[0];mz+=rt[1]}if(keys.KeyA||keys.ArrowLeft){mx-=rt[0];mz-=rt[1]}
  mx+=rt[0]*joy.x+f[0]*joy.y;mz+=rt[1]*joy.x+f[1]*joy.y;
  if(paused()){mx=0;mz=0}
  let spd=14+1.5*S.spd+SPR[S.eq][4];if(carry.length)spd/=1+carry.reduce((a,c)=>a+Math.min(120,P[c.id].ve),0)/220;
  const ml=Math.hypot(mx,mz),moving=ml>.05&&!paused();
  const wantRun=(keys.ShiftLeft||keys.ShiftRight||runHeld)&&moving;
  if(wantRun&&!tired&&stam>0){spd*=1.7;stam-=20*dt;if(stam<=0){stam=0;tired=true}}
  else{stam=Math.min(100,stam+(moving?10:20)*dt);if(tired&&stam>=30)tired=false}
  const sb=EL.stam||(EL.stam=$('#stam')),sw=Math.round(stam)+'%';if(sb._w!==sw){sb._w=sw;sb.style.width=sw}if(sb._t!==tired){sb._t=tired;sb.classList.toggle('tired',tired)}
  const hold=carry.length>0;
  if(moving){
    mx/=ml;mz/=ml;const ox=me.pos.x,oz=me.pos.z,nx=ox+mx*spd*dt,nz=oz+mz*spd*dt;
    if(!blockedAt(nx,nz)){me.pos.x=nx;me.pos.z=nz}else if(!blockedAt(nx,oz))me.pos.x=nx;else if(!blockedAt(ox,nz))me.pos.z=nz;
    me.rotation.y=Math.atan2(mx,mz);animateWalk(me,t*spd*.22,hold)
  }else animateWalk(me,0,hold);
  const gnd=onGround(me.pos.x,me.pos.z);
  if(!paused()&&(keys.Space||jumpHeld)&&me.pos.y<=0.02&&gnd){me.vy=14*SPR[S.eq][3]}
  const prevY=me.pos.y;
  if(dt>0){me.vy-=34*gravityNow()*dt;me.pos.y+=me.vy*dt}
  if(gnd&&me.pos.y<0&&prevY>-1.2&&me.vy<=0){me.pos.y=0;me.vy=0} // 이전 프레임 높이로 판정 — 저프레임·높은 점프에서 바닥을 뚫지 않게
  if(me.pos.y<-45)respawn();
  // 스프링 장식 애니메이션
  if(springGrp){
    const a=springGrp.userData;
    if(a.orb)a.orb.rotation.y+=raw*3;
    if(a.flame){a.flame.scale.y=1+Math.sin(t*20)*.25;a.flame.position.y=.3+Math.sin(t*20)*.08}
    if(a.rainbow)a.rainbow.forEach((m,i)=>m.color.setHSL((t*.5+i*.3)%1,.9,.6));
  }
  if(decoGrp.userData.spin)decoGrp.userData.spin.rotation.y+=raw;
  hazards(dt);
  // 문 표시
  gates.forEach((g,zi)=>{
    const lk=locked(zi);g.panel.visible=lk;
    const next=zi===S.zone;
    g.gl.userData.txt!==(lk?next:'o')+zi&&(g.gl.userData.txt=(lk?next:'o')+zi,g.gl.userData.setText(lk?(next?`🔒 ${zi+1}단계 시험 — E`:`🔒 ${zi+1}단계`):`🔓 ${zi+1}단계`,lk?'#ff8aa0':'#9dffb0'));
  });
  // 수호자
  guards.forEach((g,zi)=>{
    const z=Z[zi],gp=g.m.position;

    const tg=g.chase?me.pos:g.home,dx=tg.x-gp.x,dz=tg.z-gp.z,d=Math.hypot(dx,dz);
    if(d>.8&&dt>0){gp.x+=dx/d*z.gs*dt;gp.z+=dz/d*z.gs*dt;gp.x=clamp(gp.x,-SH+1,SH-1);gp.z=clamp(gp.z,z.z-SH+1,z.z+SH-1);g.m.rotation.y=Math.atan2(dx,dz);animateWalk(g.m,t*z.gs*.22)}
    else if(d<=.8)animateWalk(g.m,0);
    const gu=g.m.userData,hot=new THREE.Color(GGLOW[zi]).lerp(new THREE.Color(0xffffff),g.chase?.55:0);
    gu.eyes.color.copy(hot);gu.glow.color.copy(hot);
    gu.aura.scale.setScalar(1+Math.sin(t*3+zi)*.06);gu.aura.material.opacity=g.chase?.9:.5;

  });

  // 대상 탐색

  nests.forEach((n,zi)=>{if(locked(zi))return;n.s.forEach((id,k)=>{if(n.t[k]>0)return;const d=dist2(me.pos,nestPos(zi,k));if(d<bd){bd=d;target={kind:'nest',z:zi,k,id}}})});
  for(let i=0;i<S.slots;i++){const o=S.base[i];if(!o)continue;const d=dist2(me.pos,slotPos(i));if(d<bd){bd=d;target={kind:'base',i,id:o.id}}}
  if(pickOv&&(pickOv.t-=raw)>0){
    const pk=pickOv.pk;
    if(pk.kind==='base'&&S.base[pk.i]){const d=dist2(me.pos,slotPos(pk.i));if(!target||d<=7)target={kind:'base',i:pk.i,id:S.base[pk.i].id}}
  }else pickOv=null;
  if(!target||bd>3.5){
