server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker DNS; resolve "api" lazily so nginx starts even if api is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 300k;
    proxy_read_timeout 15s;
  }

  # Scripts change often: always revalidate.
  location ~* \.js$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp3|ogg|wav)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
