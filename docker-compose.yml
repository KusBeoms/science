# DATABASE_URL / REDIS_URL are injected by the platform (no db/redis containers here).
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    expose:
      - "80"
    labels:
      science26.public: "true"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL
      - REDIS_URL
    labels:
      science26.api: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
